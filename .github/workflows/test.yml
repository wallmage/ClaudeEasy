name: Test

on:
  push:
    branches:
      - main
    paths:
      - "claude-easy/**"
      - "tests/**"
      - "!tests/baseline.md"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "claude-easy/**"
      - "tests/**"
      - "!tests/baseline.md"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.scope.outputs.base }}
      structure: ${{ steps.scope.outputs.structure }}
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
      mihomo: ${{ steps.scope.outputs.mihomo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Select platform suites
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ruby tests/ci_scope.rb >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
                -f branch="$GITHUB_REF_NAME" \
                -f event=push \
                -f status=success \
                -f per_page=1 \
                --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true
            )"
          fi
          if [ -z "$base_sha" ] ||
             ! git cat-file -e "$base_sha^{commit}" ||
             ! git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"; then
            if [ "$EVENT_NAME" = "push" ] &&
               [ -n "$PUSH_BASE_SHA" ] &&
               [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BASE_SHA^{commit}" &&
               git merge-base --is-ancestor "$PUSH_BASE_SHA" "$GITHUB_SHA"; then
              echo "base=$PUSH_BASE_SHA" >> "$GITHUB_OUTPUT"
            fi
            ruby tests/ci_scope.rb >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          paths=()
          while IFS= read -r -d '' path; do
            paths+=("$path")
          done < <(git diff --no-renames --name-only -z "$base_sha" "$GITHUB_SHA")
          ruby tests/ci_scope.rb "${paths[@]}" >> "$GITHUB_OUTPUT"

  structure:
    needs: scope
    if: needs.scope.outputs.structure == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: CI routing contract
        run: ruby tests/test_ci_scope.rb
      - name: Skill and CI contract suite
        run: ruby tests/test_skill_contract.rb
      - name: Generated policy parity
        run: ruby tests/generate_windows_policy.rb --check
      - name: Syntax checks
        run: |
          ruby -c claude-easy/scripts/macos/patch_profiles.rb
          ruby -c claude-easy/scripts/macos/verify_routes.rb
          ruby -c tests/ci_scope.rb
          sh -n claude-easy/scripts/install_macos.sh
          sh -n claude-easy/scripts/uninstall_macos.sh
      - name: Source tree whitespace checks
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base }}
        run: |
          git diff --check
          if [ -n "$CI_BASE_SHA" ]; then
            git diff --check "$CI_BASE_SHA" HEAD
          else
            git show --check --format= HEAD
          fi
      - name: Node syntax and contract checks
        run: |
          node --check claude-easy/scripts/windows/clash_verge_global.js
          node --test tests/test_windows_patcher.js
          node --test tests/test_region_fingerprint_page.js

  macos:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Select macOS suite steps
        id: paths
        shell: bash
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base }}
        run: |
          run_wrappers=false
          run_probes=false
          if [ -z "$CI_BASE_SHA" ]; then
            run_wrappers=true
            run_probes=true
          else
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [[ "$path" =~ ^\.github/workflows/ ]] || \
                 [[ "$path" == "tests/ci_scope.rb" ]] || \
                 [[ "$path" == "tests/test_ci_scope.rb" ]]; then
                run_wrappers=true
                run_probes=true
                break
              fi
              if [[ "$path" =~ ^claude-easy/scripts/(install|uninstall)_macos\.sh$ ]] || \
                 [[ "$path" == "tests/test_macos_wrappers.rb" ]]; then
                run_wrappers=true
              fi
              if [[ "$path" =~ ^claude-easy/scripts/macos/patch_profiles/(profile_writer|subscriptions|runtime)\.rb$ ]] || \
                 [[ "$path" == "tests/run_macos_production_probes.rb" ]] || \
                 [[ "$path" == "tests/test_macos_patcher.rb" ]] || \
                 [[ "$path" == "tests/test_macos_wrappers.rb" ]] || \
                 [[ "$path" =~ ^tests/support/ ]] || \
                 [[ "$path" =~ ^tests/fixtures/macos ]]; then
                run_probes=true
              fi
            done < <(git diff --no-renames --name-only "$CI_BASE_SHA" "$GITHUB_SHA")
          fi
          echo "run_wrappers=$run_wrappers" >> "$GITHUB_OUTPUT"
          echo "run_probes=$run_probes" >> "$GITHUB_OUTPUT"
      - name: Ruby regression suite
        run: ruby tests/test_macos_patcher.rb
      - name: Ruby regressions on the production runtime
        if: github.event_name == 'workflow_dispatch'
        run: /usr/bin/ruby tests/test_macos_patcher.rb
      - name: Ruby 3.3 command wrapper behavior
        if: steps.paths.outputs.run_wrappers == 'true'
        run: ruby tests/test_macos_wrappers.rb
      - name: Fault-inject production commit, kill, alias, process, and uninstall boundaries
        if: steps.paths.outputs.run_probes == 'true'
        run: ruby tests/run_macos_production_probes.rb

  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [core, safe-update, recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Select Windows suite steps
        id: paths
        shell: bash
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base }}
        run: |
          run_installer=true
          run_routes=false
          if [ -z "$CI_BASE_SHA" ]; then
            run_routes=true
          else
            installer_match=false
            routes_match=false
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [[ "$path" =~ ^\.github/workflows/ ]] || \
                 [[ "$path" == "tests/ci_scope.rb" ]] || \
                 [[ "$path" == "tests/test_ci_scope.rb" ]]; then
                installer_match=true
                routes_match=true
                break
              fi
              if [[ "$path" =~ ^claude-easy/scripts/windows/ ]] && \
                 [[ "$path" != "claude-easy/scripts/windows/clash_verge_global.js" ]]; then
                installer_match=true
              fi
              if [[ "$path" =~ ^claude-easy/scripts/(install_windows|uninstall_windows) ]]; then
                installer_match=true
              fi
              if [[ "$path" == "tests/test_windows_installer.ps1" ]]; then
                installer_match=true
              fi
              if [[ "$path" == "tests/test_windows_routes.ps1" ]]; then
                installer_match=true
                routes_match=true
              fi
              if [[ "$path" == "tests/fixtures/main_group_cases.json" ]]; then
                installer_match=true
                routes_match=true
              fi
              if [[ "$path" =~ ^tests/fixtures/transform_expected/ ]]; then
                installer_match=true
              fi
              if [[ "$path" == "claude-easy/references/policy.json" ]] || \
                 [[ "$path" == "claude-easy/references/result-contract.json" ]]; then
                installer_match=true
                routes_match=true
              fi
              if [[ "$path" == "claude-easy/scripts/windows/verify_routes.ps1" ]]; then
                routes_match=true
              fi
            done < <(git diff --no-renames --name-only "$CI_BASE_SHA" "$GITHUB_SHA")
            if [ "$installer_match" = true ]; then
              run_installer=true
            else
              run_installer=false
            fi
            if [ "$routes_match" = true ]; then
              run_routes=true
            fi
          fi
          echo "run_installer=$run_installer" >> "$GITHUB_OUTPUT"
          echo "run_routes=$run_routes" >> "$GITHUB_OUTPUT"
      - name: Parse shipped PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -LiteralPath ./claude-easy -Filter *.ps1 -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw ("PowerShell parse failed for {0}:{1}{2}" -f $file.FullName, [Environment]::NewLine, ($errors | Out-String))
            }
          }
      - name: Smoke-test install_windows.ps1 JSON contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ("claude-easy-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $fixtureRoot "profiles") -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $fixtureRoot "config.yaml"), "mixed-port: 7890`nmode: rule`n")
          [System.IO.File]::WriteAllText((Join-Path $fixtureRoot "verge.yaml"), "enable_tun_mode: false`n")
          [System.IO.File]::WriteAllText((Join-Path $fixtureRoot "profiles.yaml"), "items: []`n")
          $runtime = (Get-Command powershell.exe).Source
          $output = & $runtime -NoLogo -NoProfile -File ./claude-easy/scripts/install_windows.ps1 -AppHome $fixtureRoot -ShowUsageProfile -Json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install_windows.ps1 smoke test failed with exit code $LASTEXITCODE" }
          $result = $output.Trim() | ConvertFrom-Json
          foreach ($field in @("command", "status", "code")) {
            if ($null -eq $result.PSObject.Properties[$field]) { throw "smoke JSON omitted $field" }
          }
      - name: PowerShell 5.1 installer, uninstaller, and route regressions
        if: steps.paths.outputs.run_installer == 'true'
        shell: powershell
        run: |
          $runtime = (Get-Command powershell.exe).Source
          & $runtime -NoLogo -NoProfile -File ./tests/test_windows_installer.ps1 -PowerShellPath $runtime -ExpectedPSEdition Desktop -ExpectedPSMajor 5 -TestGroup '${{ matrix.group }}'
          if ($LASTEXITCODE -ne 0) { throw "Windows full suite failed with exit code $LASTEXITCODE" }
      - name: Focused route regressions on PowerShell 5.1
        if: matrix.group == 'core' && steps.paths.outputs.run_routes == 'true'
        shell: powershell
        run: |
          $runtime = (Get-Command powershell.exe).Source
          & $runtime -NoLogo -NoProfile -File ./tests/test_windows_routes.ps1 -PowerShellPath $runtime -ExpectedPSEdition Desktop -ExpectedPSMajor 5
          if ($LASTEXITCODE -ne 0) { throw "Windows route suite failed" }

  mihomo:
    needs: scope
    if: needs.scope.outputs.macos == 'true' && needs.scope.outputs.mihomo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"runner":"macos-15","architecture":"arm64","minimum_sha256":"3617c9d8a5a55aecfe1ebd0f55ff59f2706c8ad68fd65c6c4e5f7cf2b74263f1","current_sha256":"4dc25df9e899f14161911302a8ee5fc9e202ed9c976fc405bf82c50ff27466ca"},{"runner":"macos-15-intel","architecture":"amd64","current_sha256":"b57fec2e38462532fe75252792b355b99db16b0b8ea2d6bdf0cd8bc7ddacb9d2"}]' || '[{"runner":"macos-15","architecture":"arm64","minimum_sha256":"3617c9d8a5a55aecfe1ebd0f55ff59f2706c8ad68fd65c6c4e5f7cf2b74263f1","current_sha256":"4dc25df9e899f14161911302a8ee5fc9e202ed9c976fc405bf82c50ff27466ca"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Download current Mihomo
        env:
          MIHOMO_ARCHITECTURE: ${{ matrix.architecture }}
          MIHOMO_CURRENT_SHA256: ${{ matrix.current_sha256 }}
        run: |
          archive="$RUNNER_TEMP/mihomo-CURRENT.gz"
          binary="$RUNNER_TEMP/mihomo-CURRENT"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-darwin-$MIHOMO_ARCHITECTURE-v1.19.29.gz"
          echo "$MIHOMO_CURRENT_SHA256  $archive" | shasum -a 256 --check
          gzip --decompress --stdout "$archive" > "$binary"
          chmod 700 "$binary"
          echo "MIHOMO_CURRENT_PATH=$binary" >> "$GITHUB_ENV"
      - name: Download minimum Mihomo
        if: github.event_name == 'workflow_dispatch' && matrix.architecture == 'arm64'
        env:
          MIHOMO_ARCHITECTURE: ${{ matrix.architecture }}
          MIHOMO_MINIMUM_SHA256: ${{ matrix.minimum_sha256 }}
        run: |
          archive="$RUNNER_TEMP/mihomo-MINIMUM.gz"
          binary="$RUNNER_TEMP/mihomo-MINIMUM"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-darwin-$MIHOMO_ARCHITECTURE-v1.19.27.gz"
          echo "$MIHOMO_MINIMUM_SHA256  $archive" | shasum -a 256 --check
          gzip --decompress --stdout "$archive" > "$binary"
          chmod 700 "$binary"
          echo "MIHOMO_MINIMUM_PATH=$binary" >> "$GITHUB_ENV"
      - name: Validate all profiles with current Mihomo
        env:
          CLAUDE_EASY_REQUIRE_REAL_MIHOMO: "1"
        run: CLAUDE_EASY_TEST_MIHOMO="$MIHOMO_CURRENT_PATH" ruby tests/run_macos_mihomo_validation.rb
      - name: Validate all profiles with minimum Mihomo
        if: github.event_name == 'workflow_dispatch' && matrix.architecture == 'arm64'
        env:
          CLAUDE_EASY_REQUIRE_REAL_MIHOMO: "1"
        run: CLAUDE_EASY_TEST_MIHOMO="$MIHOMO_MINIMUM_PATH" ruby tests/run_macos_mihomo_validation.rb

  windows-mihomo:
    needs: scope
    if: needs.scope.outputs.windows == 'true' && needs.scope.outputs.mihomo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"version":"v1.19.27","sha256":"34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee","executable":"powershell.exe","edition":"Desktop","major":5},{"version":"v1.19.29","sha256":"1a8520cfe425441eba3eba8623b27b985020031243fe1ecaa1af2b92358a03f9","executable":"powershell.exe","edition":"Desktop","major":5}]' || '[{"version":"v1.19.29","sha256":"1a8520cfe425441eba3eba8623b27b985020031243fe1ecaa1af2b92358a03f9","executable":"powershell.exe","edition":"Desktop","major":5}]') }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Download and verify official Windows Mihomo
        shell: powershell
        env:
          MIHOMO_VERSION: ${{ matrix.version }}
          MIHOMO_SHA256: ${{ matrix.sha256 }}
          GEOSITE_COMMIT: "8616d0c188f1eed5b7e01bd088f1c3b3002d5496"
          GEOSITE_SHA256: "0dd6474f59287d925ff2b10957e21657872c72170919a0b947bcc1ed6957cceb"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64.zip"
          curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 `
            --output $archive `
            "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_VERSION/mihomo-windows-amd64-$env:MIHOMO_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { throw "Mihomo download failed" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:MIHOMO_SHA256) { throw "Mihomo checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $core = @(Get-ChildItem -LiteralPath $destination -Filter "mihomo*.exe" -File -Recurse)
          if ($core.Count -ne 1) { throw "Mihomo archive did not contain exactly one executable" }
          $geosite = Join-Path $env:RUNNER_TEMP "GeoSite.dat"
          curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 `
            --output $geosite `
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/$env:GEOSITE_COMMIT/geosite.dat"
          if ($LASTEXITCODE -ne 0) { throw "GeoSite.dat download failed" }
          $actual = (Get-FileHash -LiteralPath $geosite -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GEOSITE_SHA256) { throw "GeoSite.dat checksum mismatch" }
      - name: Validate all Windows profiles through the public installer
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64"
          $core = @(Get-ChildItem -LiteralPath $destination -Filter "mihomo*.exe" -File -Recurse)
          if ($core.Count -ne 1) { throw "Mihomo executable is missing before validation" }
          $targetPowerShell = (Get-Command '${{ matrix.executable }}').Source
          $geosite = Join-Path $env:RUNNER_TEMP "GeoSite.dat"
          & $targetPowerShell -NoLogo -NoProfile -File ./tests/test_windows_installer.ps1 `
            -PowerShellPath $targetPowerShell `
            -ExpectedPSEdition '${{ matrix.edition }}' `
            -ExpectedPSMajor ${{ matrix.major }} `
            -RealMihomoPaths @($core[0].FullName) `
            -RealMihomoGeoSitePath $geosite `
            -RealMihomoOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows real Mihomo suite failed" }
