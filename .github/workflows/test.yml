name: Test

on:
  push:
    branches:
      - main
    paths:
      - "claude-easy/**"
      - "tests/**"
      - "!tests/baseline.md"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "claude-easy/**"
      - "tests/**"
      - "!tests/baseline.md"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.scope.outputs.base }}
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Select platform suites
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ruby tests/ci_scope.rb >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
                -f branch="$GITHUB_REF_NAME" \
                -f event=push \
                -f status=success \
                -f per_page=1 \
                --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true
            )"
          fi
          if [ -z "$base_sha" ] ||
             ! git cat-file -e "$base_sha^{commit}" ||
             ! git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"; then
            if [ "$EVENT_NAME" = "push" ] &&
               [ -n "$PUSH_BASE_SHA" ] &&
               [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BASE_SHA^{commit}" &&
               git merge-base --is-ancestor "$PUSH_BASE_SHA" "$GITHUB_SHA"; then
              echo "base=$PUSH_BASE_SHA" >> "$GITHUB_OUTPUT"
            fi
            ruby tests/ci_scope.rb >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          paths=()
          while IFS= read -r -d '' path; do
            paths+=("$path")
          done < <(git diff --no-renames --name-only -z "$base_sha" "$GITHUB_SHA")
          ruby tests/ci_scope.rb "${paths[@]}" >> "$GITHUB_OUTPUT"

  macos:
    needs: scope
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Ruby regression suite and production coverage
        run: ruby tests/coverage_ruby.rb
      - name: Skill and CI contract suite
        run: ruby tests/test_skill_contract.rb
      - name: Offline region fingerprint page
        run: node --test tests/test_region_fingerprint_page.js
      - name: Windows engine suite
        run: node --experimental-test-coverage --test --test-coverage-include=claude-easy/scripts/windows/clash_verge_global.js --test-coverage-lines=100 --test-coverage-functions=100 --test-coverage-branches=80 tests/test_windows_patcher.js
      - name: Generated policy parity
        run: ruby tests/generate_windows_policy.rb --check
      - name: Production runtime and syntax checks
        run: |
          /usr/bin/ruby -e 'abort "expected Ruby 2.6" unless RUBY_VERSION.start_with?("2.6.")'
          /usr/bin/ruby -c claude-easy/scripts/macos/patch_profiles.rb
          /usr/bin/ruby -c claude-easy/scripts/macos/verify_routes.rb
          ruby -c tests/ci_scope.rb
          node --check claude-easy/scripts/windows/clash_verge_global.js
          sh -n claude-easy/scripts/install_macos.sh
          sh -n claude-easy/scripts/uninstall_macos.sh
      - name: Source tree whitespace checks
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base }}
        run: |
          git diff --check
          if [ -n "$CI_BASE_SHA" ]; then
            git diff --check "$CI_BASE_SHA" HEAD
          else
            git show --check --format= HEAD
          fi

  macos-browser:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install region fingerprint browser test dependencies
        run: |
          npm ci
          npx playwright install webkit
      - name: Real Chrome and WebKit region fingerprint page
        env:
          CLAUDE_EASY_BROWSER_TARGETS: chrome,webkit
        run: node tests/test_region_fingerprint_browser.js

  macos-mutation:
    needs: scope
    if: needs.scope.outputs.macos == 'true' || needs.scope.outputs.windows == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Safety mutation checks
        run: ruby tests/test_mutation_safety.rb

  macos-wrappers:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Ruby 3.3 command wrapper behavior
        run: ruby tests/test_macos_wrappers.rb

  macos-production-runtime:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Ruby regressions on the production runtime
        run: /usr/bin/ruby tests/test_macos_patcher.rb
      - name: Contract regressions on the production runtime
        run: /usr/bin/ruby tests/test_skill_contract.rb
      - name: Command wrappers on the production runtime
        run: /usr/bin/ruby tests/test_macos_wrappers.rb

  macos-production-probes:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Fault-inject production commit, kill, alias, process, and uninstall boundaries
        run: ruby tests/run_macos_production_probes.rb

  mihomo:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            minimum_sha256: "3617c9d8a5a55aecfe1ebd0f55ff59f2706c8ad68fd65c6c4e5f7cf2b74263f1"
            current_sha256: "4dc25df9e899f14161911302a8ee5fc9e202ed9c976fc405bf82c50ff27466ca"
          - runner: macos-15-intel
            architecture: amd64
            minimum_sha256: "5392bea435a1c4b0a496571daafa977f744207cfafac18fb78a9b7d0747585c2"
            current_sha256: "b57fec2e38462532fe75252792b355b99db16b0b8ea2d6bdf0cd8bc7ddacb9d2"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.3"
      - name: Download and verify pinned Mihomo versions
        env:
          MIHOMO_ARCHITECTURE: ${{ matrix.architecture }}
          MIHOMO_MINIMUM_SHA256: ${{ matrix.minimum_sha256 }}
          MIHOMO_CURRENT_SHA256: ${{ matrix.current_sha256 }}
        run: |
          for entry in \
            "v1.19.27:$MIHOMO_MINIMUM_SHA256:MINIMUM" \
            "v1.19.29:$MIHOMO_CURRENT_SHA256:CURRENT"
          do
            IFS=: read -r version expected label <<EOF
          $entry
          EOF
            archive="$RUNNER_TEMP/mihomo-$label.gz"
            binary="$RUNNER_TEMP/mihomo-$label"
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 \
              --output "$archive" \
              "https://github.com/MetaCubeX/mihomo/releases/download/$version/mihomo-darwin-$MIHOMO_ARCHITECTURE-$version.gz"
            echo "$expected  $archive" | shasum -a 256 --check
            gzip --decompress --stdout "$archive" > "$binary"
            chmod 700 "$binary"
            echo "MIHOMO_${label}_PATH=$binary" >> "$GITHUB_ENV"
          done
      - name: Validate all profiles with minimum Mihomo
        env:
          CLAUDE_EASY_REQUIRE_REAL_MIHOMO: "1"
        run: CLAUDE_EASY_TEST_MIHOMO="$MIHOMO_MINIMUM_PATH" ruby tests/run_macos_mihomo_validation.rb
      - name: Validate all profiles with current Mihomo
        env:
          CLAUDE_EASY_REQUIRE_REAL_MIHOMO: "1"
        run: CLAUDE_EASY_TEST_MIHOMO="$MIHOMO_CURRENT_PATH" ruby tests/run_macos_mihomo_validation.rb

  windows-installer-powershell-5:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Offline region fingerprint page
        run: node --test tests/test_region_fingerprint_page.js
      - name: Install region fingerprint browser test dependencies
        run: npm ci
      - name: Real Chrome and Edge region fingerprint page
        env:
          CLAUDE_EASY_BROWSER_TARGETS: chrome,edge
        run: node tests/test_region_fingerprint_browser.js
      - name: PowerShell 5.1 installer, uninstaller, and route regressions
        shell: powershell
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "claude-easy-windows-full-5.json"
          Remove-Item -LiteralPath $receipt -Force -ErrorAction SilentlyContinue
          $runtime = (Get-Command powershell.exe).Source
          & $runtime -NoLogo -NoProfile -File ./tests/test_windows_installer.ps1 -PowerShellPath $runtime -ExpectedPSEdition Desktop -ExpectedPSMajor 5 -CompletionReceiptPath $receipt
          if ($LASTEXITCODE -ne 0) { throw "Windows full suite failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw "Windows full suite did not produce its completion receipt" }
          $completed = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($completed.Mode -ne "Full" -or $completed.PSEdition -ne "Desktop" -or [int]$completed.PSMajor -ne 5) {
            throw "Windows full suite produced an invalid completion receipt"
          }

  windows-installer-powershell-7:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Offline region fingerprint page
        run: node --test tests/test_region_fingerprint_page.js
      - name: PowerShell 7 installer, uninstaller, and route regressions
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "claude-easy-windows-full-7.json"
          Remove-Item -LiteralPath $receipt -Force -ErrorAction SilentlyContinue
          $runtime = (Get-Command pwsh.exe).Source
          & $runtime -NoLogo -NoProfile -File ./tests/test_windows_installer.ps1 -PowerShellPath $runtime -ExpectedPSEdition Core -ExpectedPSMajor 7 -CompletionReceiptPath $receipt
          if ($LASTEXITCODE -ne 0) { throw "Windows full suite failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw "Windows full suite did not produce its completion receipt" }
          $completed = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($completed.Mode -ne "Full" -or $completed.PSEdition -ne "Core" -or [int]$completed.PSMajor -ne 7) {
            throw "Windows full suite produced an invalid completion receipt"
          }

  windows-mihomo:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.19.27
            sha256: "34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee"
            executable: powershell.exe
            edition: Desktop
            major: 5
          - version: v1.19.29
            sha256: "1a8520cfe425441eba3eba8623b27b985020031243fe1ecaa1af2b92358a03f9"
            executable: powershell.exe
            edition: Desktop
            major: 5
          - version: v1.19.27
            sha256: "34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee"
            executable: pwsh.exe
            edition: Core
            major: 7
          - version: v1.19.29
            sha256: "1a8520cfe425441eba3eba8623b27b985020031243fe1ecaa1af2b92358a03f9"
            executable: pwsh.exe
            edition: Core
            major: 7
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Download and verify official Windows Mihomo
        shell: powershell
        env:
          MIHOMO_VERSION: ${{ matrix.version }}
          MIHOMO_SHA256: ${{ matrix.sha256 }}
          GEOSITE_COMMIT: "8616d0c188f1eed5b7e01bd088f1c3b3002d5496"
          GEOSITE_SHA256: "0dd6474f59287d925ff2b10957e21657872c72170919a0b947bcc1ed6957cceb"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64.zip"
          curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 `
            --output $archive `
            "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_VERSION/mihomo-windows-amd64-$env:MIHOMO_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { throw "Mihomo download failed" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:MIHOMO_SHA256) { throw "Mihomo checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $core = @(Get-ChildItem -LiteralPath $destination -Filter "mihomo*.exe" -File -Recurse)
          if ($core.Count -ne 1) { throw "Mihomo archive did not contain exactly one executable" }
          $geosite = Join-Path $env:RUNNER_TEMP "GeoSite.dat"
          curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 `
            --output $geosite `
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/$env:GEOSITE_COMMIT/geosite.dat"
          if ($LASTEXITCODE -ne 0) { throw "GeoSite.dat download failed" }
          $actual = (Get-FileHash -LiteralPath $geosite -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GEOSITE_SHA256) { throw "GeoSite.dat checksum mismatch" }
      - name: Validate all Windows profiles through the public installer
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "mihomo-windows-amd64"
          $core = @(Get-ChildItem -LiteralPath $destination -Filter "mihomo*.exe" -File -Recurse)
          if ($core.Count -ne 1) { throw "Mihomo executable is missing before validation" }
          $targetPowerShell = (Get-Command '${{ matrix.executable }}').Source
          $receipt = Join-Path $env:RUNNER_TEMP "claude-easy-windows-mihomo.json"
          $geosite = Join-Path $env:RUNNER_TEMP "GeoSite.dat"
          Remove-Item -LiteralPath $receipt -Force -ErrorAction SilentlyContinue
          $nonce = [Guid]::NewGuid().ToString("N")
          & $targetPowerShell -NoLogo -NoProfile -File ./tests/test_windows_installer.ps1 `
            -PowerShellPath $targetPowerShell `
            -ExpectedPSEdition '${{ matrix.edition }}' `
            -ExpectedPSMajor ${{ matrix.major }} `
            -RealMihomoPaths @($core[0].FullName) `
            -RealMihomoGeoSitePath $geosite `
            -RealMihomoOnly `
            -CompletionReceiptPath $receipt `
            -CompletionReceiptNonce $nonce
          if ($LASTEXITCODE -ne 0) { throw "Windows real Mihomo suite failed" }
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) {
            throw "Windows real Mihomo suite did not produce its completion receipt"
          }
          $completed = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($completed.Mode -ne "RealMihomo" -or
              $completed.PSEdition -ne '${{ matrix.edition }}' -or
              [int]$completed.PSMajor -ne ${{ matrix.major }} -or
              $completed.Nonce -ne $nonce -or
              [int]$completed.CoreCount -ne $core.Count) {
            throw "Windows real Mihomo suite produced an invalid completion receipt"
          }
          $actualCases = @($completed.Cases | ForEach-Object { "$($_.Core):$($_.Profile)" })
          $expectedCases = @("1:1", "1:2", "1:3")
          if (@(Compare-Object $expectedCases $actualCases).Count -ne 0) {
            throw "Windows real Mihomo suite did not complete every usage profile"
          }
