interface:
  display_name: "ClaudeEasy 配置与诊断"
  short_description: "按用途配置、诊断或更新 Clash 订阅"
  default_prompt: "使用 $claude-easy 按用户要求分析、复核、修复、配置、监测或更新 Clash；更新前先提醒用户请自行登录服务商管理后台，打开每份订阅的订阅开关并等待明确确认，不得代替用户操作服务商后台，不做更新前测试，只备份并按平台原生方式更新；安全更新重新应用订阅文件补丁，更新后不重跑安装命令，只按已保存档位完成客户端动作、全部验收和最终复核；诊断前读取用途档位并只处理当前存储位置，未获授权不写入，绝对不要退出、停止或重启 Clash 客户端。"
